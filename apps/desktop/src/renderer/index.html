<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Atlas</title>
  </head>
  <body>
    <pre id="status">Carregando…</pre>
    <label for="persona-select">Persona:</label>
    <select id="persona-select"></select>
    <span id="persona-error"></span>
    <hr />
    <form id="ask-form">
      <input id="objective" type="text" placeholder="Digite um objetivo" />
      <button type="submit">Perguntar</button>
    </form>
    <pre id="ask-result"></pre>
    <hr />
    <div id="chat-transcript"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Digite uma mensagem" autocomplete="off" />
      <button id="chat-send" type="submit">Enviar</button>
    </form>
    <hr />
    <h2>Memória</h2>
    <button id="memory-refresh" type="button">Atualizar</button>
    <ul id="memory-list"></ul>
    <hr />
    <h2>Permissões</h2>
    <div>
      <h3>Leitura</h3>
      <ul id="read-roots-list"></ul>
      <input id="read-root-input" type="text" placeholder="/caminho/absoluto" />
      <button id="read-root-add" type="button">Adicionar</button>
    </div>
    <div>
      <h3>Escrita</h3>
      <ul id="write-roots-list"></ul>
      <input id="write-root-input" type="text" placeholder="/caminho/absoluto" />
      <button id="write-root-add" type="button">Adicionar</button>
    </div>
    <button id="permissions-apply" type="button">Aplicar</button>
    <span id="permissions-error"></span>
    <script src="./renderer.js"></script>
  </body>
</html>
